name: Trivy security scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"

permissions:
  contents: read
  security-events: write

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4.37.4
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: forkroom-api:scan
          cache-from: type=gha,scope=security-api
          cache-to: type=gha,mode=max,scope=security-api
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: forkroom-api:scan
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4.37.4
        if: always()
        with:
          sarif_file: trivy-image.sarif
