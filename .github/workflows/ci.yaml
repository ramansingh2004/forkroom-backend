name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest
      - run: uv build

  collaboration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collaboration
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: collaboration/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build collaboration image
        uses: docker/build-push-action@v6
        with:
          context: collaboration
          push: false
          cache-from: type=gha,scope=collaboration
          cache-to: type=gha,mode=max,scope=collaboration
      - run: docker compose -f compose.yaml -f compose.observability.yaml config --quiet
