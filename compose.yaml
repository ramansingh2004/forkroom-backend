name: forkroom-backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: forkroom
      POSTGRES_USER: forkroom
      POSTGRES_PASSWORD: forkroom
    ports:
      - "5434:5432"
    volumes:
      - forkroom_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forkroom -d forkroom"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - forkroom_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: forkroom
      RABBITMQ_DEFAULT_PASS: forkroom
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - forkroom_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: forkroom
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-forkroom-development-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - forkroom_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.16.0-alpine3.24
    command:
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:-development-turn-secret-change-me}
      - --realm=${TURN_REALM:-forkroom.local}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+asyncpg://forkroom:forkroom@postgres:5432/forkroom
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://forkroom:forkroom@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      FRONTEND_URL: http://localhost:3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development-access-secret-change-me-32}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-development-refresh-secret-change-me-32}
      JWT_COLLABORATION_SECRET: ${JWT_COLLABORATION_SECRET:-development-collaboration-secret-32}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: forkroom
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-forkroom-development-secret}
      MINIO_BUCKET: forkroom-attachments
      EXPORT_URL_EXPIRE_MINUTES: ${EXPORT_URL_EXPIRE_MINUTES:-15}
      EXPORT_PROCESSING_MAX_ATTEMPTS: ${EXPORT_PROCESSING_MAX_ATTEMPTS:-5}
      MEETING_WEBSOCKET_URL: ws://localhost:8000/api/v1/ws/meetings
      MEETING_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      TURN_URLS: '["stun:localhost:3478","turn:localhost:3478?transport=udp","turn:localhost:3478?transport=tcp"]'
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-development-turn-secret-change-me}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  collaboration:
    build:
      context: ./collaboration
    environment:
      COLLABORATION_HOST: 0.0.0.0
      COLLABORATION_PORT: 1234
      COLLABORATION_ALLOWED_ORIGINS: http://localhost:3000
      JWT_COLLABORATION_SECRET: ${JWT_COLLABORATION_SECRET:-development-collaboration-secret-32}
      DATABASE_URL: postgresql://forkroom:forkroom@postgres:5432/forkroom
      REDIS_URL: redis://redis:6379/0
      PRESENCE_TTL_SECONDS: 60
      LOG_LEVEL: info
    ports:
      - "1234:1234"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=notifications.email,scheduler,files.process,exports.generate,search.index,integrations.events",
      ]
    environment: &worker-environment
      DATABASE_URL: postgresql+asyncpg://forkroom:forkroom@postgres:5432/forkroom
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://forkroom:forkroom@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      FRONTEND_URL: http://localhost:3000
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: forkroom
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-forkroom-development-secret}
      MINIO_BUCKET: forkroom-attachments
      EXPORT_PROCESSING_MAX_ATTEMPTS: ${EXPORT_PROCESSING_MAX_ATTEMPTS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment: *worker-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  forkroom_postgres_data:
  forkroom_redis_data:
  forkroom_rabbitmq_data:
  forkroom_minio_data:
