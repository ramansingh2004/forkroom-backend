name: forkroom-backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: forkroom
      POSTGRES_USER: forkroom
      POSTGRES_PASSWORD: forkroom
    ports:
      - "5434:5432"
    volumes:
      - forkroom_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forkroom -d forkroom"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - forkroom_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: forkroom
      RABBITMQ_DEFAULT_PASS: forkroom
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - forkroom_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+asyncpg://forkroom:forkroom@postgres:5432/forkroom
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://forkroom:forkroom@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      FRONTEND_URL: http://localhost:3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development-access-secret-change-me-32}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-development-refresh-secret-change-me-32}
      JWT_COLLABORATION_SECRET: ${JWT_COLLABORATION_SECRET:-development-collaboration-secret-32}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  collaboration:
    build:
      context: ./collaboration
    environment:
      COLLABORATION_HOST: 0.0.0.0
      COLLABORATION_PORT: 1234
      COLLABORATION_ALLOWED_ORIGINS: http://localhost:3000
      JWT_COLLABORATION_SECRET: ${JWT_COLLABORATION_SECRET:-development-collaboration-secret-32}
      DATABASE_URL: postgresql://forkroom:forkroom@postgres:5432/forkroom
      REDIS_URL: redis://redis:6379/0
      PRESENCE_TTL_SECONDS: 60
      LOG_LEVEL: info
    ports:
      - "1234:1234"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=notifications.email,scheduler",
      ]
    environment: &worker-environment
      DATABASE_URL: postgresql+asyncpg://forkroom:forkroom@postgres:5432/forkroom
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://forkroom:forkroom@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment: *worker-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  forkroom_postgres_data:
  forkroom_redis_data:
  forkroom_rabbitmq_data:
